<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; manifest-src 'self'; connect-src 'self' https:"
    />
    <meta name="theme-color" content="#211811" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>Chronos Settlement</title>
    <style>
      :root {
        --bg: #211811;
        --wood: rgba(36, 26, 18, 0.96);
        --wood-edge: #6e4d2e;
        --btn: #3b2b1e;
        --btn-on: #7a5a33;
        --text: #f1e2c2;
        --text-dim: #bfa981;
        --strip-h: 250px;
        --tabs-h: 92px;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        background: linear-gradient(#1a2030, #2a2a36 55%, var(--bg));
        color: var(--text);
        font: 600 14px/1.3 var(--font-body);
      }
      [hidden] {
        display: none !important;
      }
      iframe {
        display: block;
        border: 0;
      }

      #top {
        position: fixed;
        top: env(safe-area-inset-top);
        left: env(safe-area-inset-left);
        right: env(safe-area-inset-right);
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 10px 8px 14px;
      }
      #top-title {
        color: #e8c88a;
        font-size: 16px;
        letter-spacing: 0.03em;
      }
      #menu-btn {
        width: 44px;
        height: 40px;
        border: 2px solid var(--wood-edge);
        border-radius: 6px;
        background: var(--btn);
        color: var(--text);
        font-size: 20px;
      }
      #hint {
        position: fixed;
        left: 24px;
        right: 24px;
        bottom: calc(var(--strip-h) + var(--tabs-h) + env(safe-area-inset-bottom) + 24px);
        color: var(--text-dim);
        font-weight: 400;
        text-align: center;
      }
      /* too short for a hint (a phone on its side) */
      @media (max-height: 560px) {
        #hint {
          display: none;
        }
      }

      #menu {
        position: fixed;
        top: calc(env(safe-area-inset-top) + 56px);
        right: calc(env(safe-area-inset-right) + 10px);
        z-index: 4;
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 230px;
        padding: 10px;
        background: var(--wood);
        border: 2px solid var(--wood-edge);
        border-radius: 6px;
      }
      #menu .item {
        min-height: 40px;
        padding: 0 12px;
        border: 1px solid #22170f;
        border-radius: 4px;
        background: var(--btn);
        color: var(--text);
        font: inherit;
        text-align: left;
      }
      #menu .item.on {
        background: var(--btn-on);
        border-color: #c79a55;
      }
      #menu .label {
        margin-top: 4px;
        color: var(--text-dim);
        font-size: 12px;
        font-weight: 400;
      }
      #menu .label.version {
        margin-top: 8px;
        padding-top: 6px;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        font-variant-numeric: tabular-nums;
      }
      #menu .zooms {
        display: flex;
        gap: 4px;
      }
      #menu .zooms .item {
        flex: 1;
        padding: 0;
        text-align: center;
      }

      /* what's selected in the town: a card just above the tabs */
      #inspect {
        position: fixed;
        left: calc(env(safe-area-inset-left) + 10px);
        right: calc(env(safe-area-inset-right) + 10px);
        bottom: calc(var(--strip-h) + var(--tabs-h) + env(safe-area-inset-bottom) + 8px);
        max-height: calc(100% - var(--strip-h) - var(--tabs-h) - 72px);
        overflow-y: auto;
        z-index: 2;
        box-sizing: border-box;
        padding: 10px 12px;
        background: var(--wood);
        border: 2px solid var(--wood-edge);
        border-radius: 8px;
      }
      #inspect .inspect-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      #inspect .inspect-title {
        color: #e8c88a;
        font-size: 15px;
      }
      #inspect .inspect-close {
        width: 34px;
        height: 30px;
        flex: none;
        border: 1px solid #22170f;
        border-radius: 4px;
        background: var(--btn);
        color: var(--text);
        font: inherit;
      }
      #inspect .inspect-lines {
        margin: 4px 0 6px;
        color: var(--text-dim);
        font-weight: 400;
        font-size: 13px;
      }
      #inspect .inspect-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      #inspect .inspect-actions button {
        min-height: 36px;
        padding: 0 14px;
        border: 1px solid #22170f;
        border-radius: 4px;
        background: var(--btn);
        color: var(--text);
        font: inherit;
        font-size: 13px;
      }
      #inspect .inspect-actions button.primary {
        background: #5a7a34;
        border-color: #8cc05a;
      }
      #inspect .inspect-actions button.danger {
        background: #6a2a20;
      }
      /* the menus' tabs, just above the town: two rows of four, or one row on a phone on its side */
      #tabs {
        position: fixed;
        left: env(safe-area-inset-left);
        right: env(safe-area-inset-right);
        bottom: calc(var(--strip-h) + env(safe-area-inset-bottom));
        z-index: 2;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
        padding: 6px;
        background: var(--wood);
        border-top: 2px solid var(--wood-edge);
      }
      @media (min-aspect-ratio: 4/3) {
        #tabs {
          grid-template-columns: repeat(7, 1fr);
        }
      }
      #tabs button {
        height: 38px;
        padding: 0 4px;
        border: 1px solid #22170f;
        border-radius: 4px;
        background: var(--btn);
        color: var(--text);
        font: inherit;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #tabs button.on {
        background: var(--btn-on);
        border-color: #c79a55;
      }
      #tabs button {
        position: relative;
      }
      /* the Research button fills from the left as the topic being studied is learned */
      .tab-fill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        background: linear-gradient(#6a9ad0, #3f6a9a);
        opacity: 0.6;
        transition: width 0.5s;
        pointer-events: none;
      }
      .tab-label {
        position: relative;
      }
      .tab-fill.trip {
        background: linear-gradient(#7fb05a, #4f7a34);
      }

      /* the menus: above the tabs (on its side: over the right half of the town, see the end) */
      #sheet {
        position: fixed;
        top: env(safe-area-inset-top);
        left: env(safe-area-inset-left);
        right: env(safe-area-inset-right);
        bottom: calc(var(--strip-h) + var(--tabs-h) + env(safe-area-inset-bottom));
        z-index: 3;
      }
      #sheet iframe {
        width: 100%;
        height: 100%;
      }
      /* a menu open takes the whole screen (the town runs itself meanwhile): the tabs drop to the bottom edge, and
         the menu fills everything above them */
      body.menu-open #sheet {
        bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom));
      }
      body.menu-open #tabs {
        bottom: env(safe-area-inset-bottom);
      }
      body.menu-open #inspect,
      body.menu-open #hint {
        display: none;
      }
      /* a castle town's taller strip leaves no room for the hint */
      body.castle #hint {
        display: none;
      }

      #strip-box {
        position: fixed;
        left: env(safe-area-inset-left);
        right: env(safe-area-inset-right);
        bottom: env(safe-area-inset-bottom);
        height: var(--strip-h);
        z-index: 1;
      }
      #strip-box iframe {
        position: relative;
        transform-origin: left top;
      }
      #strip-box.pinching {
        overflow: hidden;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-dim);
      }

      /* A phone held upright: a slim title bar; under it the feed (what the town is up to: sim/../mobile/feed.ts); the
         town, bigger, in the lower half; and one slim row of tabs along the bottom edge. (The rules for a phone on its
         side follow, and win where they overlap.) */
      #hint {
        display: none;
      }
      #tabs {
        bottom: env(safe-area-inset-bottom);
        grid-template-columns: repeat(7, 1fr);
        gap: 3px;
        padding: 4px 4px 5px;
        border-top: 2px solid var(--wood-edge);
      }
      #tabs button {
        height: 44px;
        padding: 2px 1px 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1px;
        font-size: 10.5px;
        line-height: 1.05;
      }
      .tab-icon {
        position: relative;
        font-size: 15px;
        line-height: 1;
        color: #e8c88a;
      }
      #tabs .tab-label {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 0;
      }
      #tabs .tab-label::after {
        content: attr(data-short);
        font-size: 10.5px;
      }
      #strip-box {
        bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom));
      }
      #sheet {
        bottom: calc(var(--strip-h) + var(--tabs-h) + env(safe-area-inset-bottom));
      }
      #inspect {
        bottom: calc(var(--strip-h) + var(--tabs-h) + env(safe-area-inset-bottom) + 8px);
      }
      #feed {
        position: fixed;
        top: calc(env(safe-area-inset-top) + 56px);
        left: calc(env(safe-area-inset-left) + 8px);
        right: calc(env(safe-area-inset-right) + 8px);
        bottom: calc(var(--strip-h) + var(--tabs-h) + env(safe-area-inset-bottom) + 6px);
        overflow-y: auto;
        overscroll-behavior: contain;
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      body.menu-open #feed,
      body.battle #feed,
      body.map-full #feed {
        display: none;
      }
      #map-grip {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(var(--strip-h) + var(--tabs-h) + env(safe-area-inset-bottom) - 11px);
        width: 72px;
        height: 22px;
        z-index: 3;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
        cursor: ns-resize;
      }
      #map-grip span {
        display: block;
        width: 44px;
        height: 6px;
        border-radius: 3px;
        background: rgba(232, 200, 138, 0.75);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.55), 0 1px 4px rgba(0, 0, 0, 0.6);
      }
      #map-grip.dragging span {
        background: #f4dca6;
        width: 56px;
      }
      body.menu-open #map-grip,
      body.battle #map-grip {
        display: none;
      }
      .feed-now,
      .feed-hero,
      .feed-list {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .feed-now:empty,
      .feed-hero:empty {
        display: none;
      }
      .feed-card,
      .feed-row {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 6px 9px;
        background: var(--wood);
        border: 1px solid var(--wood-edge);
        border-radius: 7px;
      }
      .feed-row {
        background: rgba(30, 22, 15, 0.72);
        border-color: rgba(110, 77, 46, 0.55);
      }
      .feed-row.key {
        background: rgba(40, 29, 19, 0.9);
      }
      .feed-card.alarm {
        border-color: #d0503a;
        background: rgba(70, 22, 16, 0.94);
      }
      .feed-card.doom {
        border-color: #8a9ac8;
      }
      .feed-card.delve {
        border-color: #8a6a3a;
        background: linear-gradient(90deg, rgba(60, 40, 20, 0.85), rgba(30, 24, 18, 0.85));
        cursor: pointer;
      }
      .feed-card.ask {
        border-color: #e8c88a;
      }
      /* an event just answered: the choice and what came of it */
      .feed-card.answered {
        border-color: #7aa860;
      }
      .feed-card.answered .feed-pic {
        color: #a8d080;
      }
      .feed-pic {
        flex: none;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 5px;
        background: rgba(0, 0, 0, 0.25);
        color: #e8c88a;
        font-size: 20px;
        overflow: hidden;
      }
      .feed-pic canvas {
        image-rendering: pixelated;
      }
      .feed-body {
        min-width: 0;
        flex: 1;
      }
      .feed-title {
        color: #e8c88a;
        font-family: var(--font-display);
        font-size: 14px;
      }
      .feed-text {
        font-weight: 400;
        font-size: 13px;
      }
      .feed-when {
        color: var(--text-dim);
        font-weight: 400;
        font-size: 11px;
      }
      .feed-row {
        cursor: pointer;
      }
      .feed-row.open {
        border-color: #c79a55;
      }
      .feed-acts {
        margin-top: 4px;
      }
      .feed-acts button {
        font: inherit;
        font-size: 12px;
        padding: 4px 10px;
        color: var(--text);
        background: var(--wood);
        border: 1px solid #c79a55;
        border-radius: 5px;
      }
      .feed-head {
        margin: 2px 2px -2px;
        color: #e8c88a;
        font-family: var(--font-display);
        font-size: 13px;
        letter-spacing: 0.04em;
      }
      .feed-hp {
        height: 4px;
        margin-top: 4px;
        border-radius: 2px;
        background: rgba(0, 0, 0, 0.4);
        overflow: hidden;
      }
      .feed-hp span {
        display: block;
        height: 100%;
        background: #7fb05a;
      }
      .feed-empty {
        padding: 8px 4px;
        color: var(--text-dim);
        font-weight: 400;
        text-align: center;
      }

      /* A phone on its side: no title bar. The tabs run across the top with the ☰ at their end, the town fills the
         rest, and the menus (and the selected thing's card) open over the right half of the town, leaving the left
         half to look at and tap. (Last in the sheet, so these win over the rules above.) */
      @media (orientation: landscape) and (max-height: 560px) {
        #top {
          top: calc(env(safe-area-inset-top) + 6px);
          left: auto;
          right: calc(env(safe-area-inset-right) + 6px);
          padding: 0;
          z-index: 4;
        }
        #top-title {
          display: none;
        }
        #menu-btn {
          height: 38px;
        }
        #menu {
          top: calc(env(safe-area-inset-top) + var(--tabs-h) + 4px);
        }
        #tabs {
          top: env(safe-area-inset-top);
          bottom: auto;
          gap: 4px;
          padding: 6px 58px 6px 6px;
          border-top: 0;
          border-bottom: 2px solid var(--wood-edge);
        }
        #tabs button {
          height: 38px;
          flex-direction: row;
          font-size: 13px;
        }
        .tab-icon {
          display: none;
        }
        #tabs .tab-label {
          font-size: 13px;
        }
        #tabs .tab-label::after {
          content: none;
        }
        #feed,
        #map-grip {
          display: none;
        }
        #strip-box {
          bottom: env(safe-area-inset-bottom);
        }
        #sheet {
          top: calc(env(safe-area-inset-top) + var(--tabs-h));
          left: 50%;
          bottom: env(safe-area-inset-bottom);
          border-left: 2px solid var(--wood-edge);
        }
        /* (a menu open: the whole width under the tabs) */
        body.menu-open #sheet {
          left: env(safe-area-inset-left);
          bottom: env(safe-area-inset-bottom);
          border-left: 0;
        }
        body.menu-open #tabs {
          bottom: auto;
        }
        #inspect {
          top: calc(env(safe-area-inset-top) + var(--tabs-h) + 8px);
          bottom: auto;
          left: calc(50% + 8px);
          right: calc(env(safe-area-inset-right) + 8px);
          max-height: calc(100% - var(--tabs-h) - 16px - env(safe-area-inset-bottom));
        }
      }
      /* a choice event: the whole screen, a picture over the telling, the answers as big buttons (eventSheet.ts) */
      #event-sheet {
        position: fixed;
        inset: 0;
        z-index: 40;
        overflow-y: auto;
        overscroll-behavior: contain;
        background: #16110c;
        color: #f0e4c8;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #event-sheet[hidden] {
        display: none;
      }
      .event-art {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: linear-gradient(180deg, #2a3a4a, #16110c);
        overflow: hidden;
        border-bottom: 2px solid #c79a55;
      }
      .event-backdrop {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 100%;
        image-rendering: pixelated;
      }
      .event-who {
        position: absolute;
        left: 6%;
        bottom: 4%;
        height: 46%;
        width: auto;
        image-rendering: pixelated;
        filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.8));
      }
      .event-body {
        padding: 14px 16px 24px;
      }
      .event-title {
        font-family: var(--font-display);
        font-size: 22px;
        color: #ffe08a;
        margin-bottom: 8px;
      }
      .event-text p {
        margin: 0 0 10px;
        font-size: 16px;
        line-height: 1.5;
      }
      .event-options {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 14px;
      }
      .event-option {
        min-height: 48px;
        padding: 10px 14px;
        font: inherit;
        font-size: 16px;
        text-align: left;
        color: #f0e4c8;
        background: #3b2b1e;
        border: 2px solid #6e4d2e;
        border-radius: 6px;
      }
      .event-option.default {
        border-color: #c79a55;
      }
      /* answered: the choice taken and what came of it, in the answers' place */
      .event-result {
        margin-top: 14px;
      }
      .event-chose {
        padding: 10px 14px;
        font-size: 16px;
        color: #ffe08a;
        background: #3b2b1e;
        border: 2px solid #c79a55;
        border-radius: 6px;
      }
      .event-came {
        margin: 12px 0;
        padding: 10px 14px;
        font-size: 16px;
        line-height: 1.5;
        background: #1f2a1c;
        border-left: 4px solid #7fbf6a;
        border-radius: 4px;
      }
      .event-came.waiting {
        color: #a89878;
      }
      .event-came-head {
        font-family: var(--font-display);
        font-size: 14px;
        color: #9fd98a;
        margin-bottom: 4px;
      }
      .event-continue {
        width: 100%;
        text-align: center;
        border-color: #c79a55;
      }
      .event-count {
        margin-top: 10px;
        font-size: 13px;
        color: #a89878;
      }
      /* on its side: the picture on the left, the telling beside it */
      @media (orientation: landscape) and (max-height: 560px) {
        #event-sheet {
          display: grid;
          grid-template-columns: 46% 1fr;
          overflow: hidden;
        }
        .event-art {
          aspect-ratio: auto;
          height: 100%;
          border-bottom: 0;
          border-right: 2px solid #c79a55;
        }
        .event-body {
          overflow-y: auto;
        }
      }
    </style>
  </head>
  <body>
    <div id="top">
      <span id="top-title">Chronos Settlement</span>
      <button id="menu-btn" title="Menu">☰</button>
    </div>
    <div id="menu" hidden></div>
    <div id="hint">Tap people and buildings to see them, and drag to look along the town. A long press cancels.</div>
    <div id="feed"></div>
    <div id="inspect" hidden></div>
    <div id="tabs"></div>
    <div id="sheet" hidden></div>
    <div id="strip-box"><div id="loading">Loading the town…</div></div>
    <script src="mobile.js"></script>
  </body>
</html>
