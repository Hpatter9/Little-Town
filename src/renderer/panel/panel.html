<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <title>Chronos Settlement</title>
    <style>
      :root {
        --bg: #211811;
        --wood-edge: #6e4d2e;
        --header: #33251a;
        --btn: #3b2b1e;
        --btn-hover: #574029;
        --text: #f1e2c2;
        --text-dim: #bfa981;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 var(--font-body);
        user-select: none;
        overflow: hidden;
      }
      body {
        box-sizing: border-box;
        border: 2px solid var(--wood-edge);
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 6px 6px 14px;
        background: var(--header);
        border-bottom: 2px solid var(--wood-edge);
      }
      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      #close {
        width: 28px;
        height: 24px;
        border: 1px solid #22170f;
        border-radius: 3px;
        background: var(--btn);
        color: var(--text);
        font: 700 14px/1 var(--font-body);
        cursor: pointer;
      }
      #close:hover {
        background: var(--btn-hover);
      }
      main {
        flex: 1;
        padding: 16px 18px;
        overflow: auto;
      }
      .empty {
        color: var(--text-dim);
      }
      h2 {
        margin: 14px 0 6px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-dim);
      }
      .alerts-form {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin: 12px 0;
      }
      .form-row {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
      }
      .form-label {
        width: 130px;
        color: var(--text-dim);
      }
      .form-row input {
        flex: 1;
        max-width: 260px;
        padding: 4px 6px;
        background: #1a120c;
        color: var(--text);
        border: 1px solid #4a3522;
        border-radius: 3px;
        font: inherit;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
      }
      .era-head {
        margin: 18px 0 0;
        padding-bottom: 4px;
        border-bottom: 1px solid #c79a55;
        color: #e8c88a;
      }
      .era-head:first-of-type {
        margin-top: 8px;
      }
      .panel-head {
        display: flex;
        justify-content: space-between;
        color: var(--text-dim);
      }
      .venue-row {
        display: flex;
        gap: 8px;
        margin: 8px 0 4px;
      }
      .venue-row button {
        flex: 1;
        padding: 10px 8px;
        font-family: var(--font-display);
      }
      .queue {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 8px;
      }
      .queue-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        background: #2c2018;
        border: 1px solid #4a3522;
        border-radius: 4px;
      }
      .queue-name {
        min-width: 150px;
        font-weight: 700;
      }
      .queue-time {
        min-width: 110px;
        color: var(--text-dim);
        font-size: 12px;
      }
      .bar {
        flex: 1;
        height: 6px;
        background: #1a120c;
        border-radius: 3px;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        background: #ffd84a;
      }
      .card.unique {
        border-color: #ff9a30;
        box-shadow: inset 0 0 0 1px rgba(255, 154, 48, 0.35);
      }
      .card.unique .card-name {
        color: #ffb050;
      }
      .card.done {
        opacity: 0.55;
        border-color: #5a7a3a;
      }
      .hint {
        margin-top: 6px;
        color: var(--text-dim);
        font-size: 12px;
      }
      .row {
        display: flex;
        gap: 6px;
      }
      .place.quiet {
        background: #3b2b1e;
      }
      .card.arrival {
        margin-top: 8px;
        border-color: #c79a55;
      }
      .queue {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 4px;
      }
      .order {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 8px;
        background: #2c2018;
        border: 1px solid #4a3522;
        border-radius: 4px;
      }
      .order-info {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      .order-info .bar {
        flex: none;
      }
      .inventory {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .inv-item {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 2px 8px 2px 2px;
        background: #2c2018;
        border: 1px solid #4a3522;
        border-radius: 4px;
        font-size: 12px;
      }
      .recipe-top .card-name,
      .gear {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .gear {
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--text-dim);
      }
      .gear .item-icon {
        background-color: #1f1610;
        border-radius: 3px;
      }
      .journal-day {
        margin: 12px 0 4px;
      }
      .journal-day:first-child {
        margin-top: 0;
      }
      .journal-row {
        display: flex;
        gap: 10px;
        padding: 3px 2px;
        font-size: 12px;
        border-bottom: 1px solid #33261b;
      }
      .journal-row:not(.key) {
        color: var(--text-dim);
      }
      .journal-row.key {
        font-weight: 600;
      }
      .journal-time {
        flex: none;
        color: var(--text-dim);
        font-variant-numeric: tabular-nums;
      }
      .card.away {
        margin: 4px 0;
        border-color: #c79a55;
      }
      .away-lines {
        margin: 0;
        padding-left: 18px;
        color: var(--text-dim);
        font-size: 12px;
        line-height: 1.4;
      }
      table.grid {
        border-collapse: collapse;
        font-size: 12px;
      }
      table.grid th {
        padding: 2px 6px;
        color: var(--text-dim);
        font-weight: 600;
        text-align: center;
      }
      table.grid td {
        padding: 2px 3px;
        text-align: center;
      }
      table.grid td.grid-name {
        padding-right: 10px;
        text-align: left;
        font-weight: 700;
      }
      .prio {
        width: 64px;
        padding: 2px 0;
        border: 1px solid #22170f;
        border-radius: 3px;
        color: var(--text);
        font: 600 11px var(--font-body);
        cursor: pointer;
      }
      .prio.p1 {
        background: #7a5a33;
      }
      .prio.p2 {
        background: #4e3a26;
      }
      .prio.p3 {
        background: #33261b;
        color: var(--text-dim);
      }
      .prio.p0 {
        background: #1c1510;
        color: #7a6a52;
      }
      .prio.auto {
        font-style: italic;
      }
      .card.person {
        margin-bottom: 8px;
      }
      .bars {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .bar-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
      }
      .bar-label {
        width: 48px;
        color: var(--text-dim);
      }
      .bar-row .bar {
        flex: 0 0 140px;
      }
      .bar-fill.low {
        background: #e06040;
      }
      .bar-text {
        color: var(--text-dim);
      }
      .reasons {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        font-size: 12px;
      }
      .reasons .good {
        color: #a8d080;
      }
      .reasons .bad {
        color: #f0a080;
      }
      .skills {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1px 12px;
        font-size: 12px;
      }
      .skill {
        display: flex;
        justify-content: space-between;
      }
      .skill.good {
        color: #ffe08a;
      }
      .skill.weak {
        color: #8a7a62;
      }
      .skill .lvl {
        font-variant-numeric: tabular-nums;
      }
      .traits {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .cards.wide {
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      }
      .party {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 10px;
        font-size: 12px;
      }
      .pick {
        cursor: pointer;
      }
      .pick-row {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
      }
      .pick-row select {
        margin-left: auto;
        background: #3b2b1e;
        color: var(--text);
        border: 1px solid #22170f;
        border-radius: 3px;
        font: 11px var(--font-body);
      }
      .row.stance {
        margin-top: 2px;
      }
      .place.small.on {
        background: #7a5a33;
        border-color: #c79a55;
      }
      .place.small {
        margin: 0;
        padding: 2px 8px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 8px;
      }
      .card {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 8px 10px;
        background: #2c2018;
        border: 1px solid #4a3522;
        border-radius: 4px;
      }
      .card.locked {
        opacity: 0.6;
      }
      .card-top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
      }
      .card-name {
        font-weight: 700;
      }
      .card-size,
      .purpose,
      .lock {
        color: var(--text-dim);
        font-size: 12px;
      }
      .cost {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .chip {
        padding: 0 6px;
        border-radius: 3px;
        background: #3b2b1e;
        font-size: 12px;
      }
      .short {
        color: #f0a080;
      }
      /* a dungeon's party picker: a chip a fighter, lit when picked */
      .row.delvers {
        flex-wrap: wrap;
        gap: 6px;
        margin: 4px 0;
      }
      .row.delvers .chip {
        padding: 6px 10px;
        border: 1px solid #22170f;
        color: #c8b89a;
        cursor: pointer;
      }
      .row.delvers .chip.on {
        background: #6a4a1e;
        border-color: #ffd84a;
        color: #ffe8a8;
      }
      .place {
        align-self: flex-start;
        margin-top: 2px;
        padding: 3px 14px;
        border: 1px solid #22170f;
        border-radius: 3px;
        background: #5a4228;
        color: var(--text);
        font: 600 12px var(--font-body);
        cursor: pointer;
      }
      .place:hover:not(:disabled) {
        background: #7a5a33;
      }
      .place:disabled {
        opacity: 0.5;
        cursor: default;
      }
      /* The world map on the Expedition Board (square; smaller on a short screen, like a phone on its side) */
      .world-map {
        position: relative;
        width: min(100%, 62vh);
        aspect-ratio: 1;
        margin: 6px auto 4px;
        border: 2px solid #4a3522;
        border-radius: 6px;
        overflow: hidden;
        background: #1c3a5a url('world-map.jpg') center / cover no-repeat;
      }
      .map-svg,
      .map-marks {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .map-svg {
        pointer-events: none;
      }
      .map-route {
        stroke-width: 5;
        stroke-dasharray: 12 9;
        stroke-linecap: round;
      }
      .map-route.picked {
        stroke: #ffd84a;
      }
      .map-route.party {
        stroke: #8cc05a;
      }
      /* a destination: a big invisible tap target round a small dot */
      .map-dot {
        position: absolute;
        width: 30px;
        height: 30px;
        padding: 0;
        border: 0;
        background: transparent;
        transform: translate(-50%, -50%);
        cursor: pointer;
      }
      .map-dot::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        width: 9px;
        height: 9px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: #f1e2c2;
        border: 2px solid #3b2b1e;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35);
      }
      .map-dot.locked::after {
        background: #8a7a6a;
      }
      /* a region's scouting trip: a ringed dot, out in the fog */
      .map-dot.scout::after {
        background: transparent;
        border: 3px solid #e8dcc0;
        box-sizing: border-box;
        width: 16px;
        height: 16px;
      }
      .map-dot.scout.locked::after {
        border-color: #8a7a6a;
      }
      .map-fog {
        position: absolute;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle closest-side, rgba(10, 14, 26, 0.88) 0%, rgba(10, 14, 26, 0.78) 60%, rgba(10, 14, 26, 0) 100%);
        pointer-events: none;
      }
      .map-label.fogged {
        background: none;
        color: #c8d0e0;
        font-size: 10px;
        font-style: italic;
        opacity: 0.85;
        text-shadow: 0 1px 2px #000;
      }
      .map-dot.on::after {
        background: #ffd84a;
      }
      .map-home {
        position: absolute;
        width: 13px;
        height: 13px;
        transform: translate(-50%, -50%) rotate(45deg);
        background: #e8c88a;
        border: 2px solid #3b2b1e;
        box-shadow: 0 0 0 2px rgba(232, 200, 138, 0.35);
        pointer-events: none;
      }
      /* the picked destination: a red flag on a pole, planted on the spot */
      .map-flag {
        position: absolute;
        width: 3px;
        height: 26px;
        transform: translate(-1px, -100%);
        background: #2a1c14;
        pointer-events: none;
      }
      .map-flag::after {
        content: '';
        position: absolute;
        left: 3px;
        top: 0;
        border-left: 16px solid #d8402a;
        border-top: 6px solid transparent;
        border-bottom: 6px solid transparent;
      }
      .map-label {
        position: absolute;
        transform: translate(-50%, 9px);
        padding: 1px 6px;
        border-radius: 3px;
        background: rgba(20, 14, 10, 0.82);
        color: #f1e2c2;
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
        pointer-events: none;
      }
      .map-label.picked {
        color: #ffd84a;
      }
      .map-label.left {
        transform: translate(-12px, 9px);
      }
      .map-label.right {
        transform: translate(calc(-100% + 12px), 9px);
      }
      .map-label.above {
        margin-top: -42px;
      }
      /* a party out: the size of the party, moving along its route */
      .map-party {
        position: absolute;
        min-width: 18px;
        height: 18px;
        transform: translate(-50%, -50%);
        border-radius: 9px;
        background: #4f7a34;
        border: 2px solid #d8f0b0;
        color: #fff;
        font-size: 11px;
        line-height: 18px;
        text-align: center;
        pointer-events: none;
      }
      .map-party.fighting {
        background: #a83a2a;
        border-color: #ffc0a0;
      }
      .map-hint {
        text-align: center;
        margin-bottom: 8px;
      }
      .card.chosen {
        border-color: #ffd84a;
        box-shadow: inset 0 0 0 1px #ffd84a;
      }

      /* New town: pickable cards */
      .card.pick {
        cursor: pointer;
        text-align: left;
        color: var(--text);
        font: inherit;
      }
      .card.pick:hover {
        border-color: #7a5a33;
      }
      .card.pick.on {
        border-color: #c79a55;
        background: #3b2b1e;
        box-shadow: inset 0 0 0 1px #c79a55;
      }
      .newgame-head {
        margin: 14px 0 6px;
        color: #e8c88a;
        font-size: 13px;
      }
      .newgame-head:first-child {
        margin-top: 4px;
      }
      .card.pick .purpose {
        white-space: pre-line;
      }
      .founder {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .card.pick.founder-card {
        flex-direction: row;
        align-items: flex-start;
        gap: 10px;
      }
      .founder-art {
        width: 72px;
        height: 72px;
        flex: none;
        image-rendering: pixelated;
        background: radial-gradient(#3b2b1e, #211811 70%);
        border: 1px solid rgba(0, 0, 0, 0.45);
        border-radius: 4px;
      }
      .founder-body {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .founder-title {
        font-style: italic;
        font-size: 12px;
        color: var(--text-dim);
      }
      .founder-skills {
        font-size: 11px;
        color: var(--text-dim);
      }
      .card.pick.on .founder-title,
      .card.pick.on .founder-skills,
      .card.pick.on .purpose {
        color: var(--text);
      }
      .founder-side {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .founder-side .place {
        align-self: stretch;
        margin: 0;
      }
      .founder-preview {
        width: 128px;
        height: 128px;
        image-rendering: pixelated;
        background: radial-gradient(#3b2b1e, #211811 70%);
        border: 1px solid #4a3522;
        border-radius: 4px;
      }
      .founder-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
      }
      .founder-name {
        padding: 5px 8px;
        background: #1a120c;
        color: var(--text);
        border: 1px solid #4a3522;
        border-radius: 3px;
        font: inherit;
      }
      .looks {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .look-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 5px;
      }
      .look-label {
        width: 78px;
        color: var(--text-dim);
        font-size: 12px;
      }
      .look-value {
        flex: 0 1 90px;
        min-width: 0;
        white-space: nowrap;
        text-align: center;
        font-size: 12px;
      }
      .hair-row {
        flex-wrap: nowrap;
      }
      .swatches {
        flex: 1;
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        min-width: 0;
      }
      .look-row:has(.swatches) {
        flex-wrap: nowrap;
        align-items: flex-start;
      }
      .look-row:has(.swatches) .look-label {
        flex: none;
        padding-top: 3px;
      }
      .swatch {
        width: 22px;
        height: 22px;
        padding: 0;
        border: 2px solid #22170f;
        border-radius: 50%;
        cursor: pointer;
      }
      .swatch.on {
        border-color: #f1e2c2;
        box-shadow: 0 0 0 1px #c79a55;
      }
      .trait-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      .trait-chips .hint {
        flex-basis: 100%;
      }
      .place.found {
        margin-top: 14px;
        padding: 6px 22px;
        font-size: 13px;
        background: #7a5a33;
        border-color: #c79a55;
      }
      .shop-frame {
        display: flex;
        justify-content: center;
        margin: 8px 0 4px;
      }
      .shop-floor {
        display: block;
        width: 100%;
        max-width: 560px;
        height: auto;
        max-height: 48vh;
        object-fit: contain;
        image-rendering: pixelated;
        border: 2px solid #22170f;
        border-radius: 3px;
        background: #22170f;
      }
      /* wide (a phone on its side): the picture on the left, what the shop's doing beside it */
      @media (min-aspect-ratio: 3/2) {
        .shop-layout {
          display: grid;
          grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
          gap: 16px;
          align-items: start;
        }
        .shop-layout .shop-frame {
          position: sticky;
          top: 0;
        }
        .shop-floor {
          max-height: 72vh;
        }
      }
      .shop-tier {
        margin: 4px 0 8px;
      }
      .shop-tier.locked {
        opacity: 0.55;
      }
      .shop-tier-top {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 3px;
      }
      .shop-tier-name {
        font-weight: 700;
        color: #e8c88a;
      }
      .shop-tier-from {
        color: var(--text-dim);
        font-size: 12px;
      }
      .chip.dim {
        color: var(--text-dim);
        background: #2a1f16;
      }
      .shop-guest {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 8px;
        padding: 3px 0;
        border-bottom: 1px solid #33251a;
        font-size: 12px;
      }
      .shop-guest-name {
        font-weight: 700;
      }
      .shop-guest-want {
        color: var(--text-dim);
      }
      .ledger-in {
        color: #8fd07a;
        text-align: right;
      }
      .ledger-out {
        color: #e0806a;
        text-align: right;
      }
      .shop-coins {
        color: #f0d060;
        font-weight: 700;
      }
      .shop-pieces {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      .shop-log {
        display: flex;
        gap: 8px;
        font-size: 12px;
        padding: 2px 0;
        border-bottom: 1px solid #33251a;
      }
      .shop-when {
        flex: none;
        color: var(--text-dim);
        white-space: nowrap;
      }
      /* the townsfolk list: a short row each; tap one to inspect them */
      .folk-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 10px;
      }
      .folk-row {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 4px 8px 4px 4px;
        text-align: left;
        font: inherit;
        color: var(--text);
        background: rgba(0, 0, 0, 0.28);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        cursor: pointer;
      }
      .folk-row:hover {
        background: rgba(255, 255, 255, 0.06);
      }
      .pixel-figure {
        image-rendering: pixelated;
        flex: none;
      }
      .folk-face {
        width: 40px;
        height: 40px;
        border-radius: 3px;
        background: rgba(0, 0, 0, 0.35);
      }
      .folk-mid {
        display: flex;
        flex-direction: column;
        min-width: 0;
        flex: 1;
        line-height: 1.25;
      }
      .folk-name {
        font-weight: 700;
      }
      .folk-class {
        font-size: 11px;
        color: #ffe08a;
      }
      .folk-doing {
        font-size: 11px;
        color: var(--text-dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .folk-right {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 3px;
        flex: none;
      }
      .mini-bar {
        display: block;
        width: 52px;
        height: 5px;
        border-radius: 2px;
        background: rgba(0, 0, 0, 0.5);
        overflow: hidden;
      }
      .mini-bar span {
        display: block;
        height: 100%;
        background: #6cbf4a;
      }
      .mini-bar.mood span {
        background: #e0b84a;
      }
      .mini-bar span.low {
        background: #e06040;
      }
      .folk-flag {
        font-size: 10px;
        color: #f0a080;
      }
      .folk-go {
        font-size: 20px;
        color: var(--text-dim);
        flex: none;
      }
      .back-btn {
        margin-bottom: 8px;
      }
      .class-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 4px 0;
      }
      .class-chip {
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .class-row .skill-bar {
        display: block;
        flex: 1;
        max-width: 140px;
        height: 6px;
        border-radius: 3px;
        background: rgba(0, 0, 0, 0.45);
        overflow: hidden;
      }
      .class-row .skill-bar span {
        display: block;
        height: 100%;
        background: #8ab0ff;
      }
      .class-path {
        margin: 2px 0 4px;
        padding-left: 8px;
        border-left: 2px solid rgba(255, 224, 138, 0.4);
      }
      .inspect-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas: 'who' 'gear' 'rest';
      }
      .inspect-who {
        grid-area: who;
      }
      .inspect-gear {
        grid-area: gear;
      }
      .inspect-rest {
        grid-area: rest;
      }
      /* wide (a phone on its side): their gear on the left, who they are and the rest beside it */
      @media (min-aspect-ratio: 3/2) {
        .inspect-layout {
          grid-template-columns: minmax(0, 380px) minmax(0, 1fr);
          grid-template-rows: auto 1fr;
          grid-template-areas: 'gear who' 'gear rest';
          gap: 0 16px;
          align-items: start;
        }
        .folk-list {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        }
        .inspect-gear h2:first-child {
          margin-top: 0;
        }
      }
      /* their gear laid out round them, as in Diablo */
      .doll {
        display: grid;
        grid-template-columns: 76px minmax(0, 1fr) 76px;
        grid-template-rows: 64px 96px 96px 64px;
        grid-template-areas:
          'head figure charm'
          'body figure pack'
          'weapon figure offhand'
          '. tool .';
        gap: 6px;
        padding: 10px;
        max-width: 380px;
        margin: 0 auto 8px;
        box-sizing: border-box;
        background: radial-gradient(ellipse at 50% 45%, rgba(120, 90, 50, 0.25), transparent 60%), #120d09;
        border: 2px solid #5a4630;
        border-radius: 4px;
        box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.8);
      }
      .doll-figure {
        grid-area: figure;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-width: 0;
      }
      .doll-figure .pixel-figure {
        max-width: 100%;
        height: auto !important;
      }
      .doll-level {
        font-size: 11px;
        color: #ffe08a;
        text-align: center;
      }
      .doll-slot {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        min-width: 0;
        cursor: pointer;
        background: linear-gradient(#1c1510, #0a0705);
        border: 2px solid #3a2e22;
        border-radius: 3px;
        box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.9);
        color: var(--text-dim);
        font: inherit;
      }
      .doll-slot.full {
        border-color: var(--q, #8a7a60);
        box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.9), 0 0 6px color-mix(in srgb, var(--q, #8a7a60) 45%, transparent);
      }
      .doll-slot.on {
        outline: 2px solid #ffe08a;
        outline-offset: 1px;
      }
      .doll-empty {
        font-size: 22px;
        opacity: 0.25;
      }
      .doll-label {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 1px;
        font-size: 9px;
        text-align: center;
        color: rgba(255, 255, 255, 0.4);
        pointer-events: none;
      }
      .doll-plus {
        position: absolute;
        top: 1px;
        right: 3px;
        font-size: 11px;
        font-weight: 700;
        color: #8ad0ff;
        text-shadow: 0 1px 0 #000;
      }
      .item-card {
        max-width: 380px;
        margin: 0 auto 8px;
        box-sizing: border-box;
        background: #0e0a07;
        border: 1px solid #5a4630;
      }
      .item-head {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .item-name {
        font-weight: 700;
        font-size: 14px;
      }
      .item-kind {
        font-size: 11px;
        color: var(--text-dim);
        margin: 2px 0 4px;
      }
      .item-stats {
        color: #8ab0ff;
        font-size: 12px;
        margin-bottom: 4px;
      }
      /* what they carry: a grid of cells, as in Diablo's bag */
      .bag {
        display: grid;
        grid-template-columns: repeat(8, minmax(0, 1fr));
        gap: 3px;
        width: 100%;
        max-width: 380px;
        margin: 0 auto;
      }
      .bag-cell {
        position: relative;
        aspect-ratio: 1;
        min-height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0c0806;
        border: 1px solid #3a2e22;
        box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.9);
      }
      .bag-cell.full {
        border-color: #6e5a40;
      }
      .bag-word {
        font-size: 10px;
      }
      .bag-count {
        position: absolute;
        right: 2px;
        bottom: 0;
        font-size: 10px;
        font-weight: 700;
        text-shadow: 0 1px 0 #000;
      }
      .bag-foot {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        justify-content: center;
        margin-top: 6px;
        font-size: 12px;
        color: var(--text-dim);
      }
      .fight-stats {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
        gap: 4px 12px;
        font-size: 12px;
      }
      .fight-stat {
        display: flex;
        justify-content: space-between;
      }
      .fight-label {
        color: var(--text-dim);
      }
      .fight-value {
        font-weight: 700;
      }
      .kit {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title"></h1>
      <button id="close" title="Close">&#x2715;</button>
    </header>
    <main id="body"></main>
    <script src="panel.js"></script>
  </body>
</html>
