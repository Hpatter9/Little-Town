<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; manifest-src 'self'"
    />
    <meta name="theme-color" content="#211811" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>Chronos Settlement</title>
    <style>
      :root {
        --bg: #211811;
        --wood: rgba(36, 26, 18, 0.96);
        --wood-edge: #6e4d2e;
        --btn: #3b2b1e;
        --btn-on: #7a5a33;
        --text: #f1e2c2;
        --text-dim: #bfa981;
        --strip-h: 250px;
        --tabs-h: 92px;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        background: linear-gradient(#1a2030, #2a2a36 55%, var(--bg));
        color: var(--text);
        font: 600 14px/1.3 'Segoe UI', system-ui, sans-serif;
      }
      [hidden] {
        display: none !important;
      }
      iframe {
        display: block;
        border: 0;
      }

      #top {
        position: fixed;
        top: env(safe-area-inset-top);
        left: env(safe-area-inset-left);
        right: env(safe-area-inset-right);
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 10px 8px 14px;
      }
      #top-title {
        color: #e8c88a;
        font-size: 16px;
        letter-spacing: 0.03em;
      }
      #menu-btn {
        width: 44px;
        height: 40px;
        border: 2px solid var(--wood-edge);
        border-radius: 6px;
        background: var(--btn);
        color: var(--text);
        font-size: 20px;
      }
      #hint {
        position: fixed;
        left: 24px;
        right: 24px;
        bottom: calc(var(--strip-h) + var(--tabs-h) + env(safe-area-inset-bottom) + 24px);
        color: var(--text-dim);
        font-weight: 400;
        text-align: center;
      }
      /* too short for a hint (a phone on its side) */
      @media (max-height: 560px) {
        #hint {
          display: none;
        }
      }

      #menu {
        position: fixed;
        top: calc(env(safe-area-inset-top) + 56px);
        right: calc(env(safe-area-inset-right) + 10px);
        z-index: 4;
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 230px;
        padding: 10px;
        background: var(--wood);
        border: 2px solid var(--wood-edge);
        border-radius: 6px;
      }
      #menu .item {
        min-height: 40px;
        padding: 0 12px;
        border: 1px solid #22170f;
        border-radius: 4px;
        background: var(--btn);
        color: var(--text);
        font: inherit;
        text-align: left;
      }
      #menu .item.on {
        background: var(--btn-on);
        border-color: #c79a55;
      }
      #menu .label {
        margin-top: 4px;
        color: var(--text-dim);
        font-size: 12px;
        font-weight: 400;
      }
      #menu .zooms {
        display: flex;
        gap: 4px;
      }
      #menu .zooms .item {
        flex: 1;
        padding: 0;
        text-align: center;
      }

      /* what's selected in the town: a card just above the tabs */
      #inspect {
        position: fixed;
        left: calc(env(safe-area-inset-left) + 10px);
        right: calc(env(safe-area-inset-right) + 10px);
        bottom: calc(var(--strip-h) + var(--tabs-h) + env(safe-area-inset-bottom) + 8px);
        max-height: calc(100% - var(--strip-h) - var(--tabs-h) - 72px);
        overflow-y: auto;
        z-index: 2;
        box-sizing: border-box;
        padding: 10px 12px;
        background: var(--wood);
        border: 2px solid var(--wood-edge);
        border-radius: 8px;
      }
      #inspect .inspect-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      #inspect .inspect-title {
        color: #e8c88a;
        font-size: 15px;
      }
      #inspect .inspect-close {
        width: 34px;
        height: 30px;
        flex: none;
        border: 1px solid #22170f;
        border-radius: 4px;
        background: var(--btn);
        color: var(--text);
        font: inherit;
      }
      #inspect .inspect-lines {
        margin: 4px 0 6px;
        color: var(--text-dim);
        font-weight: 400;
        font-size: 13px;
      }
      #inspect .inspect-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      #inspect .inspect-actions button {
        min-height: 36px;
        padding: 0 14px;
        border: 1px solid #22170f;
        border-radius: 4px;
        background: var(--btn);
        color: var(--text);
        font: inherit;
        font-size: 13px;
      }
      #inspect .inspect-actions button.primary {
        background: #5a7a34;
        border-color: #8cc05a;
      }
      #inspect .inspect-actions button.danger {
        background: #6a2a20;
      }
      /* the menus' tabs, just above the town: two rows of four, or one row on a phone on its side */
      #tabs {
        position: fixed;
        left: env(safe-area-inset-left);
        right: env(safe-area-inset-right);
        bottom: calc(var(--strip-h) + env(safe-area-inset-bottom));
        z-index: 2;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
        padding: 6px;
        background: var(--wood);
        border-top: 2px solid var(--wood-edge);
      }
      @media (min-aspect-ratio: 4/3) {
        #tabs {
          grid-template-columns: repeat(7, 1fr);
        }
      }
      #tabs button {
        height: 38px;
        padding: 0 4px;
        border: 1px solid #22170f;
        border-radius: 4px;
        background: var(--btn);
        color: var(--text);
        font: inherit;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #tabs button.on {
        background: var(--btn-on);
        border-color: #c79a55;
      }
      #tabs button {
        position: relative;
      }
      /* the Research button fills from the left as the topic being studied is learned */
      .tab-fill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        background: linear-gradient(#6a9ad0, #3f6a9a);
        opacity: 0.6;
        transition: width 0.5s;
        pointer-events: none;
      }
      .tab-label {
        position: relative;
      }
      .tab-fill.trip {
        background: linear-gradient(#7fb05a, #4f7a34);
      }

      /* the menus: above the tabs (on its side: over the right half of the town, see the end) */
      #sheet {
        position: fixed;
        top: env(safe-area-inset-top);
        left: env(safe-area-inset-left);
        right: env(safe-area-inset-right);
        bottom: calc(var(--strip-h) + var(--tabs-h) + env(safe-area-inset-bottom));
        z-index: 3;
      }
      #sheet iframe {
        width: 100%;
        height: 100%;
      }

      #strip-box {
        position: fixed;
        left: env(safe-area-inset-left);
        right: env(safe-area-inset-right);
        bottom: env(safe-area-inset-bottom);
        height: var(--strip-h);
        z-index: 1;
      }
      #strip-box iframe {
        position: relative;
        transform-origin: left top;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-dim);
      }

      /* A phone on its side: no title bar. The tabs run across the top with the ☰ at their end, the town fills the
         rest, and the menus (and the selected thing's card) open over the right half of the town, leaving the left
         half to look at and tap. (Last in the sheet, so these win over the rules above.) */
      @media (orientation: landscape) and (max-height: 560px) {
        #top {
          top: calc(env(safe-area-inset-top) + 6px);
          left: auto;
          right: calc(env(safe-area-inset-right) + 6px);
          padding: 0;
          z-index: 4;
        }
        #top-title {
          display: none;
        }
        #menu-btn {
          height: 38px;
        }
        #menu {
          top: calc(env(safe-area-inset-top) + var(--tabs-h) + 4px);
        }
        #tabs {
          top: env(safe-area-inset-top);
          bottom: auto;
          padding: 6px 58px 6px 6px;
          border-top: 0;
          border-bottom: 2px solid var(--wood-edge);
        }
        #sheet {
          top: calc(env(safe-area-inset-top) + var(--tabs-h));
          left: 50%;
          bottom: env(safe-area-inset-bottom);
          border-left: 2px solid var(--wood-edge);
        }
        #inspect {
          top: calc(env(safe-area-inset-top) + var(--tabs-h) + 8px);
          bottom: auto;
          left: calc(50% + 8px);
          right: calc(env(safe-area-inset-right) + 8px);
          max-height: calc(100% - var(--tabs-h) - 16px - env(safe-area-inset-bottom));
        }
      }
    </style>
  </head>
  <body>
    <div id="top">
      <span id="top-title">Chronos Settlement</span>
      <button id="menu-btn" title="Menu">☰</button>
    </div>
    <div id="menu" hidden></div>
    <div id="hint">Tap people and buildings to see them, and drag to look along the town. A long press cancels.</div>
    <div id="inspect" hidden></div>
    <div id="tabs"></div>
    <div id="sheet" hidden></div>
    <div id="strip-box"><div id="loading">Loading the town…</div></div>
    <script src="mobile.js"></script>
  </body>
</html>
